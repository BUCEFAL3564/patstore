services:
  - type: web
    name: keyhub-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: keyhub-web
          property: host
      - key: EMBEDDED_MEMCACHED
        value: "true"
      - key: MEMCACHED_SERVERS
        value: 127.0.0.1:11211
      - key: CACHE_TTL_SECONDS
        value: "90"
      - key: SEED_ADMIN_EMAIL
        value: admin@keyhub.local
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_CUSTOMER_EMAIL
        value: customer@keyhub.local
      - key: SEED_CUSTOMER_PASSWORD
        value: Customer12345

  - type: web
    name: keyhub-web
    runtime: static
    branch: main
    buildCommand: >-
      mkdir -p dist &&
      cp -r index.html product.html cart.html enter.html register.html css js assets dist/ &&
      sed -i "s#const PRODUCTION_API_URL = '';#const PRODUCTION_API_URL = 'https://${API_HOST}/api';#" dist/js/config.js
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: keyhub-api
          property: host
